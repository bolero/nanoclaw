# Home assistant config (example). The real file lives at ~/.config/nanoclaw/home.yaml (mode 0600)
# and is never committed. Loaded and validated by scripts/home-config.ts; unknown keys are errors.
#
# used_by: which agents may use a resource. "<agent>" = the resource's own access level,
# "<agent>:read" = read-only even when the resource is writable.
version: 1

# Agent ids that may appear in used_by. Brokers map a caller key to one of these.
agents: [bono, family, argus]

google_accounts:
  - id: personal
    address: owner@example.com
    scopes: [gmail.readonly, calendar.readonly]
  - id: family-inbox
    address: assistant-inbox@example.com
    scopes:
      - gmail.readonly
      - calendar.events.owned
      - calendar.calendarlist.readonly
      - calendar.calendars.readonly

mailboxes:
  - id: personal
    account: personal
    mode: starred                 # only STARRED messages
    used_by: [bono]
  # mode: triaged = starred messages as above (trusted), plus non-starred mail matching `query`,
  # which the agent only sees as short Gemini-made summaries (suggestions; never auto-actions).
  # Needs a Vertex AI service-account key at ~/.config/nanoclaw/vertex-sa.json (see homelab/README.md).
  # - id: personal
  #   account: personal
  #   mode: triaged
  #   triage:
  #     query: "category:primary -category:promotions -category:social"
  #     project: my-gcp-project
  #     region: us-central1
  #     model: gemini-flash-model-id  # a Gemini Flash model id from the Vertex AI model list
  #   used_by: [bono]
  - id: family-inbox
    account: family-inbox
    mode: allowlisted-forwarders  # only mail whose authenticated outer sender is listed
    forwarders: [owner@example.com, partner@example.com]
    used_by: [family]

calendars:
  - id: personal
    account: personal
    calendar: primary             # Google calendar id, "primary", or the calendar's name
    access: read
    used_by: [bono]
  - id: school
    account: family-inbox
    calendar: School
    access: write
    used_by: [family, "bono:read"]
  - id: family
    account: family-inbox
    calendar: Family
    access: write
    used_by: [family, "bono:read"]

reminders:
  unrestricted: [bono]            # these agents see every list
  lists:
    - {id: kids, name: Kids, used_by: [family]}
    - {id: family, name: Family, used_by: [family]}

omnifocus:
  used_by: [bono]

notes:
  unrestricted: []                # these agents read and write every folder
  read_all: [bono]                # read every folder; create/edit/move/delete only where used_by allows write
  folders:
    - {id: family, name: Family, used_by: [family, bono]}

# Where new items go, by kind. Unknown kind -> hold and ask; never a silent fallback.
destinations:
  school: {list: kids, calendar: school}
  household: {list: family, calendar: family}
  personal: {list: omnifocus-inbox}

# What bono watches for stale/due tasks.
personal_watch: [omnifocus, reminders]

schedule:
  quiet_hours: "21:00-07:00"
  brief_time: "19:00"
  stale_days: 21
  nudge_cap: 3

# Optional: the app's Today and Ops boards (scripts/dashboard-feed.ts). Handles are app users (app:<handle>).
dashboard:
  audience:
    today: [alex]
    ops: [alex]
  today_calendars: [personal, family]
  gatus_url: https://status.example.com
  # Tasks on each person's Today, read through the bridges with a read-only key
  # (pnpm exec tsx scripts/bridge-policy.ts add-dashboard-key). reminders: all | [list ids]
  tasks:
    alex: {omnifocus: true, reminders: [family]}
  task_bridges:
    reminders_url: https://bridge-host.example.ts.net/mcp
    omnifocus_url: https://bridge-host.example.ts.net:8445/mcp
  weather: {latitude: 52.37, longitude: 4.90, label: Home, unit: celsius}   # unit: celsius | fahrenheit; provider: open-meteo (default) | nws (US only)

# Optional: save matching attachments to Paperless with no model involved (scripts/mail-autoarchive.ts,
# hourly timer). Exact sender (Gmail-verified via DMARC/DKIM) and exact attachment filename.
# mail_archive:
#   - id: payslips
#     account: personal          # needs gmail.readonly
#     from: payroll@example.com
#     attachment: Payslip.pdf
#     title: Payslip             # Paperless title: "Payslip YYYY-MM-DD" (mail date)
#     notify: alex               # optional: one line in this app user's Home chat on save/failure
#     share: false               # optional: true gives the Paperless Family group view access
